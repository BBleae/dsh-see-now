name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # apt 偶尔卡住；留出重试预算（见 install ffmpeg）
    strategy:
      fail-fast: false      # 一个版本挂了不要取消另一个，否则看不到全貌
      matrix:
        node: [20, 22]
    env:
      # 测试自己也会设，但兜一层：不隔离的话 chat.js/window.js 会去摸真实家目录
      DSH_HOME: ${{ runner.temp }}/dsh-home
      DSH_SEE_NO_WINDOW: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install ffmpeg
        # 和 dsh-video-storyboard 同一套：镜像偶尔慢到 180s 都拉不完 62MB 的包。
        # 拆成三次 150s，apt 会复用 /var/cache/apt/archives 里下了一半的 .deb。
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          APT_OPTS="-qq -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo timeout 120s apt-get update $APT_OPTS || sudo timeout 120s apt-get update $APT_OPTS
          for i in 1 2 3; do
            if sudo timeout 150s apt-get install -y --no-install-recommends ffmpeg; then
              break
            fi
            echo "::warning::apt-get install 第 $i 次没在 150s 内装完（已下的包会复用），重试"
          done
          ffmpeg -version | head -1

      - name: syntax check
        run: npm run check:syntax

      - name: unit + e2e tests
        run: npm test
